name: HC Firm Site Builder
practice_area: Law Firm Management
jurisdiction: Multi
version: "2.0"
author: Brian Scherer — Lovable Law / HeyCounsel
description: >
  Build a complete law firm website with Claude Code using a single command.
  /hc-firm-site:build walks an attorney with no coding background from empty
  folder to launched site in four phases — Foundation, Content, Leads + SEO,
  and Polish + Launch — deploying live at the end of every phase and resuming
  automatically across sessions. Includes Anthropic's frontend-design skill
  for distinctive, non-generic design, Sanity's seo-aeo-best-practices skill
  for current SEO/AEO/EEAT implementation, and Hardik Pandya's stop-slop
  skill to strip AI writing patterns from every line of copy, plus standalone
  page-creation and pre-launch audit commands. Based on the Lovable Law
  build (lovablelaw.com).
